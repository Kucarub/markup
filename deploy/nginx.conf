# 宿主机 Nginx 配置：/etc/nginx/conf.d/wechat-markup.conf
# 职责：托管 admin 静态站点 + 反代 /api 到 127.0.0.1:3000 + 限流
# HTTPS：申请证书后执行 certbot --nginx -d your.domain，证书与 443 由 certbot 自动追加

limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

upstream wechat_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name your.domain;

    root /var/www/makeupadmin;
    index index.html;

    # 单文件上传上限 5MB（服务端 MAX_UPLOAD_MB），留出表单余量
    client_max_body_size 8m;
    server_tokens off;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/wechat-markup.access.log;
    error_log /var/log/nginx/wechat-markup.error.log;

    # ---------- API ----------
    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        limit_conn conn_zone 20;

        proxy_pass http://wechat_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ---------- 接口文档 ----------
    location = /api-docs {
        proxy_pass http://wechat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api-docs/openapi.json {
        proxy_pass http://wechat_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- 静态资源 ----------
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # ---------- admin 单页应用 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
